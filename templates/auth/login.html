{% extends "base.html" %}

{% block title %}Login - Examination Management Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Portal Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" 
                               value="{{ username or '' }}" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-2">Don't have an account yet?</p>
                    <a href="{{ url_for('auth.register_student') }}" class="btn btn-outline-success btn-sm me-2">Register as Student</a>
                    <a href="{{ url_for('auth.register_examiner') }}" class="btn btn-outline-warning btn-sm">Register as Examiner</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
