{% extends "base.html" %}

{% block title %}My Profile - EMP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-3">Edit Student Profile</h4>
            <form method="POST" action="{{ url_for('student.edit_profile') }}">
                <div class="mb-3">
                    <label class="form-label text-muted">Username</label>
                    <input type="text" class="form-control" value="{{ user['username'] }}" disabled>
                    <div class="form-text">Username cannot be changed.</div>
                </div>
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user['full_name'] }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user['email'] }}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
