{% extends "base.html" %}

{% block title %}Edit Course - EMP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-3">Edit Course: {{ course['course_code'] }}</h4>
            <form method="POST" action="{{ url_for('admin.edit_course', course_id=course['id']) }}">
                <div class="mb-3">
                    <label for="course_code" class="form-label">Course Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="course_code" name="course_code" value="{{ course['course_code'] }}" required>
                </div>
                <div class="mb-3">
                    <label for="course_name" class="form-label">Course Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="course_name" name="course_name" value="{{ course['course_name'] }}" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ course['description'] or '' }}</textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin.courses') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
