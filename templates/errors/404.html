{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5">
    <div class="col-md-6">
        <div class="card p-5">
            <h1 class="display-3 text-secondary fw-bold">404</h1>
            <h3 class="mb-3">Page Not Found</h3>
            <p class="text-muted">The resource or page you requested could not be found.</p>
            <div class="mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
