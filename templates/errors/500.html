{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5">
    <div class="col-md-6">
        <div class="card p-5">
            <h1 class="display-3 text-warning fw-bold">500</h1>
            <h3 class="mb-3">Internal Server Error</h3>
            <p class="text-muted">An unexpected error occurred while processing your request. Please try again or contact the administrator.</p>
            <div class="mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
