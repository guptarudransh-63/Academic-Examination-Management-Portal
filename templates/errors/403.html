{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5">
    <div class="col-md-6">
        <div class="card p-5">
            <h1 class="display-3 text-danger fw-bold">403</h1>
            <h3 class="mb-3">Access Denied</h3>
            <p class="text-muted">You do not have the required permissions or role authorization to access this page.</p>
            <div class="mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
